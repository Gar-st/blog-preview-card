<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" type="text/css" href="./styles.css">
  
  <title>Frontend Mentor | Blog preview card</title>

</head>
<body>
<main class="container">
  <div class="card">
    <div class="card-img">
      <img src="./assets/images/illustration-article.svg" alt="illustration">
    </div>
    <div class="card-content">
      <div>
        <span class="card-content-category">
          Learning
        </span>
      </div>
      <div class="card-content-date">
        Published 21 Dec 2023
      </div>
      <h1 class="card-content-title">
        HTML & CSS foundations
      </h1>
      <p class="card-content-description">
        These languages are the backbone of every website, defining structure, content, and presentation.
      </p>
    </div>
    <div class="card-author">
      <img class="card-author-img" src="./assets/images/image-avatar.webp" alt="avatar">
      <span class="card-author-name">
         Greg Hooper
      </span>
    </div>
  </div>
</main>
</body>
</html>
